name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/telegram-ai-bot:latest

      - name: Deploy to server
        run: |
          ssh user@your-server "docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/telegram-ai-bot:latest && docker stop telegram-ai-bot || true && docker rm telegram-ai-bot || true && docker run -d --name telegram-ai-bot -p 8000:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/telegram-ai-bot:latest"